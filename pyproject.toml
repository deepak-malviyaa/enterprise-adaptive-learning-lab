[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-adaptive-learning-lab"
version = "0.1.0"
description = "Portable, modular ML and decision-learning research POC"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "psutil>=5.9,<7",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.12,<4"]
tabular = ["xgboost>=2,<4", "lightgbm>=4,<5", "catboost>=1.2,<2"]
deep = ["torch>=2.2,<3", "torchvision>=0.17,<1"]
rl = ["gymnasium>=0.29,<2", "stable-baselines3>=2.3,<3"]
dashboard = ["streamlit>=1.32,<2", "plotly>=5.20,<7"]
dev = ["pytest>=8,<9", "ruff>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
